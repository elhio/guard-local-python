[project]
name = "guard-local-detector"
version = "0.0.1"
description = "A local detection engine for the Guard Python client, integrating visual safety filters into your applications"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Elhio" }]
keywords = [
    "content-moderation",
    "content-safety",
    "ai-generated",
    "deepfake",
    "violence",
    "image-moderation",
    "video-moderation",
    "trust-and-safety",
    "c2pa",
    "content-credentials",
    "provenance",
    "exif",
    "metadata",
    "computer-vision",
    "onnx",
    "on-device",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.4",
    "onnxruntime>=1.20.1,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20.1; python_version >= '3.11'",
    "pillow>=10.4.0",
    "pillow-heif>=1.0.0",
    "av>=14.0.0",
    "c2pa-python>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/elhio/guard-local-python"
Repository = "https://github.com/elhio/guard-local-python"
Issues = "https://github.com/elhio/guard-local-python/issues"
Changelog = "https://github.com/elhio/guard-local-python/releases"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
docs = [
    "griffe>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
exclude = ["tests/test_contract.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
extend-select = ["D213"]
ignore = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "D200",
    "D212",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tests/test_contract.py" = ["D", "E501", "SIM105"]
"scripts/**" = ["D101", "D102", "D103", "D107"]

[tool.mypy]
packages = ["guard_local"]
strict = true

[[tool.mypy.overrides]]
module = ["av", "av.*", "c2pa", "pillow_heif", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
